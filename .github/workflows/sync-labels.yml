name: Sync labels

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: 🏷️ Sync labels
        uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
        with:
          config-file: https://raw.githubusercontent.com/VanOns/open-source-template/main/template/.github/labels.yml
          request-token: ${{ secrets.LABEL_SYNC_TOKEN }}
